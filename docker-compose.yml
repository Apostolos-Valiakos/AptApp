services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # From .env
      POSTGRES_DB: ${POSTGRES_DB} # e.g., fresha_clone
      POSTGRES_USER: postgres # Or custom user
      # Must match the app service's TZ below — appointment scheduling, the
      # staff working-hours/time-off day-of-week logic, and reminder emails
      # all depend on wall-clock day/time, not UTC. Change both if the shop
      # is not in Greece.
      TZ: "Europe/Athens"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_URI: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      NODE_ENV: production
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS} # comma-separated; server.js reads the plural form
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      APP_NAME: ${APP_NAME}
      FRONTEND_URL: ${FRONTEND_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      API_URL: ${API_URL}
      OWNER_USERNAME: ${OWNER_USERNAME} # without these, there is no way to log into the Platform console
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      TZ: "Europe/Athens" # must match the db service above
    ports:
      # Bound to localhost only — Nginx on the host is the public entry point
      # (see DEPLOY.md). Do not change this to "3000:3000" in production.
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads # Persistent file uploads (adjust path if your uploadDir is different)
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  uploads:
